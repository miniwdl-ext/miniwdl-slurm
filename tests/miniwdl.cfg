[scheduler]
container_backend=slurm_singularity
task_concurrency=200

[singularity]
exe = ["apptainer"]

run_options = [
        "--containall"
    ]

[task_runtime]
# Set downloads to 1 core to make sure github actions can schedule the job.
download_defaults = {
        "cpu": 1,
        "memory": "1G"
    }

[slurm]
extra_args = "--comment='This is a comment'"
dynamic_partition = [
    {
      "memory__ge": 30000000000,
      "cpu__gt": 3,
      "args": "--signal B:SIGUSR1@120"
    },
    {
      "memory__ge": 10000000000,
      "cpu__eq": 1,
      "args": "--signal B:SIGUSR1@100"
    },
    {
      "args": "--signal B:SIGUSR1@110"
    }
  ]
